services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kaynak
      POSTGRES_PASSWORD: kaynak
      POSTGRES_DB: kaynak
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaynak -d kaynak"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://kaynak:kaynak@db:5432/kaynak?sslmode=disable
      HTTP_ADDR: ":8088"
    ports:
      - "8088:8088"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
